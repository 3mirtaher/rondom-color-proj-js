<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">

        <div class="txt">
            <h2>Random Color</h2>
            <p>Click to generate new color</p>
        </div>

        <div class="box-generate">
            <div>#7c5cfa</div>
            <div>rgb(0 , 0 , 0)</div>
        </div>

        <button>Generate</button>
        <button>Copy code</button>

        <div class="history">
            <p>History</p>
            <div class="history-color">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

    </div>
    <script src="main.js"></script>
</body>
</html>
